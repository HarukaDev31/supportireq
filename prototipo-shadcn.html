<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Módulo Soporte TI · shadcn</title>
<meta name="viewport" content="width=1440" />

<!-- Geist (evita Inter) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- Tailwind play CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      container: { center: true, padding: '2rem' },
      extend: {
        colors: {
          border: 'hsl(var(--border))',
          input: 'hsl(var(--input))',
          ring: 'hsl(var(--ring))',
          background: 'hsl(var(--background))',
          foreground: 'hsl(var(--foreground))',
          primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
          secondary:{ DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
          destructive:{ DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
          muted:    { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
          accent:   { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
          card:     { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
          popover:  { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
          /* type/role tints */
          tipoA:    { DEFAULT:'#ea580c', soft:'#fff7ed', solid:'#ea580c', ring:'#fdba74' },
          tipoB:    { DEFAULT:'#2563eb', soft:'#eff6ff', solid:'#2563eb', ring:'#93c5fd' },
          success:  { DEFAULT:'#16a34a', soft:'#f0fdf4' },
          warning:  { DEFAULT:'#d97706', soft:'#fffbeb' },
          danger:   { DEFAULT:'#dc2626', soft:'#fef2f2' },
        },
        borderRadius: {
          lg: 'var(--radius)',
          md: 'calc(var(--radius) - 2px)',
          sm: 'calc(var(--radius) - 4px)',
        },
        fontFamily: {
          sans: ['"Geist"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
        },
        boxShadow: {
          'soft': '0 1px 2px 0 rgb(0 0 0 / 0.04), 0 1px 1px 0 rgb(0 0 0 / 0.03)',
          'card': '0 1px 3px 0 rgb(0 0 0 / 0.05), 0 1px 2px -1px rgb(0 0 0 / 0.04)',
          'pop':  '0 12px 24px -6px rgb(0 0 0 / 0.12), 0 4px 8px -2px rgb(0 0 0 / 0.06)',
        }
      }
    }
  };
</script>

<style>
  :root {
    --background: 0 0% 100%;
    --foreground: 240 10% 3.9%;
    --card: 0 0% 100%;
    --card-foreground: 240 10% 3.9%;
    --popover: 0 0% 100%;
    --popover-foreground: 240 10% 3.9%;
    --primary: 240 5.9% 10%;
    --primary-foreground: 0 0% 98%;
    --secondary: 240 4.8% 95.9%;
    --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%;
    --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%;
    --accent-foreground: 240 5.9% 10%;
    --destructive: 0 72% 51%;
    --destructive-foreground: 0 0% 98%;
    --border: 240 5.9% 90%;
    --input: 240 5.9% 90%;
    --ring: 240 5% 64.9%;
    --radius: 0.6rem;
  }
  html, body { background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { font-feature-settings: 'cv11','ss01','ss03'; }

  /* nicer scrollbars in the app */
  .scrollarea::-webkit-scrollbar { width: 10px; height: 10px; }
  .scrollarea::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  .scrollarea::-webkit-scrollbar-thumb:hover { background: hsl(240 4% 80%); background-clip: padding-box; border: 2px solid transparent; }

  /* focus ring helper to match shadcn */
  .focus-ring { outline: none; }
  .focus-ring:focus-visible { box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ring)); }

  /* subtle grid for kanban background */
  .kanban-bg {
    background-image:
      linear-gradient(hsl(var(--muted)) 0 1px, transparent 1px 100%),
      linear-gradient(90deg, hsl(var(--muted)) 0 1px, transparent 1px 100%);
    background-size: 24px 24px;
    background-position: -1px -1px;
  }

  /* hide scroll inside chat stream while keeping scroll */
  .stream { scroll-behavior: smooth; }
</style>
</head>
<body class="min-h-screen">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shadcn/icons.jsx"></script>
<script type="text/babel" src="shadcn/ui.jsx"></script>
<script type="text/babel" src="shadcn/screens-flow.jsx"></script>
<script type="text/babel" src="shadcn/screens-kanban.jsx"></script>
<script type="text/babel" src="shadcn/screens-modal.jsx"></script>
<script type="text/babel" src="shadcn/screens-detail.jsx"></script>
<script type="text/babel" src="shadcn/screens-config.jsx"></script>
<script type="text/babel" src="shadcn/screens-roles.jsx"></script>
<script type="text/babel" src="shadcn/app.jsx"></script>
</body>
</html>
