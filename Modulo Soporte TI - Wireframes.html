<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Módulo Soporte TI — Wireframes</title>
<meta name="viewport" content="width=1280" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1d1c1a;
    --ink-soft: #4a4845;
    --paper: #f6f2e9;
    --paper-2: #efeadc;
    --line: #2a2826;
    --line-soft: #8c8884;
    --orange: #e15a1a;     /* Tipo A — Proyecto */
    --orange-soft: #ffd9c2;
    --blue: #1f5fb8;        /* Tipo B — Requerimiento */
    --blue-soft: #cfe0f7;
    --green: #2f7a4a;
    --green-soft: #cfe8d8;
    --amber: #c47b15;
    --amber-soft: #f6e0bf;
    --red: #b73a2b;
    --red-soft: #f5cdc6;
    --grey-soft: #d9d4c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: "Kalam", system-ui, sans-serif; }
  body {
    background-image:
      radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,.015) 1px, transparent 1px);
    background-size: 18px 18px, 9px 9px;
    background-position: 0 0, 4px 4px;
  }
  h1, h2, h3, h4 { font-family: "Caveat", cursive; font-weight: 700; margin: 0; line-height: 1.1; }
  h1 { font-size: 56px; }
  h2 { font-size: 38px; }
  h3 { font-size: 28px; }
  h4 { font-size: 22px; }
  p, li, td, th, label, span, div { font-family: "Kalam", sans-serif; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .02em; }

  /* sketchy borders */
  .sk { border: 2.5px solid var(--line); border-radius: 14px 16px 12px 18px / 14px 12px 18px 14px; background: #fffdf7; position: relative; }
  .sk--paper { background: var(--paper-2); }
  .sk--alt  { border-radius: 18px 12px 16px 14px / 12px 18px 14px 16px; }
  .sk--tilt-l { transform: rotate(-.4deg); }
  .sk--tilt-r { transform: rotate(.3deg); }
  .sk--dash { border-style: dashed; }
  .sk--double { box-shadow: 3px 3px 0 0 rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.03); }
  .sticker { display: inline-block; padding: 3px 10px 5px; border: 2px solid var(--line); border-radius: 8px 12px 9px 14px/12px 8px 14px 9px; background: #fff; font-family: "Caveat"; font-size: 20px; line-height: 1; }
  .pill { display: inline-block; padding: 2px 10px; border: 2px solid var(--line); border-radius: 999px; background:#fff; font-size: 14px; }
  .tag-A { color: var(--orange); border-color: var(--orange); background: #fff7f1; }
  .tag-B { color: var(--blue); border-color: var(--blue); background: #f1f6ff; }
  .tag-B1 { background: #ffe8df; border-color: var(--orange); color: #8e2e0a; }
  .tag-B2 { background: #dfe9fb; border-color: var(--blue); color: #143b73; }
  .ghost { background: repeating-linear-gradient(135deg, rgba(0,0,0,.04) 0 6px, transparent 6px 12px); border: 2px dashed var(--line-soft); border-radius: 10px; color: var(--ink-soft); }

  /* shell */
  .shell { max-width: 1280px; margin: 0 auto; padding: 28px 32px 80px; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 14px; border-bottom: 2px dashed var(--line); margin-bottom: 22px; }
  .top h1 small { font-family: "Kalam"; font-size: 16px; color: var(--ink-soft); display: block; margin-top: 4px; font-weight: 400; }
  .top .meta { font-family: "JetBrains Mono"; font-size: 11px; color: var(--ink-soft); text-align: right; }
  .top .meta strong { color: var(--ink); }

  /* tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .tab { font-family: "Caveat"; font-size: 22px; padding: 6px 16px 8px; background: #fff; border: 2px solid var(--line); border-radius: 12px 8px 14px 10px / 8px 14px 10px 14px; cursor: pointer; line-height: 1; }
  .tab:hover { background: #fffaee; }
  .tab.active { background: var(--ink); color: var(--paper); transform: rotate(-.3deg); }

  .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 18px; }
  .grow { flex: 1 1 0; min-width: 0; }
  .card { padding: 18px; }
  .card h3 { margin-bottom: 8px; }
  .card h4 { margin-bottom: 6px; }
  .muted { color: var(--ink-soft); }
  .small { font-size: 13px; }
  .xs { font-size: 12px; }
  .center { text-align: center; }
  .hr { border-top: 2px dashed var(--line-soft); margin: 10px 0; }

  .anno { font-family: "Caveat"; font-size: 20px; color: var(--ink-soft); }
  .anno::before { content: "↳ "; }

  /* kanban */
  .kanban { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .kcol { padding: 10px; min-height: 280px; background: #fffdf7; border: 2px solid var(--line); border-radius: 12px 10px 14px 10px / 10px 14px 10px 14px; }
  .kcol header { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 8px; border-bottom: 2px dashed var(--line-soft); margin-bottom: 8px; }
  .kcol header .name { font-family: "Caveat"; font-size: 22px; line-height: 1; }
  .kcol .count { font-family: "JetBrains Mono"; font-size: 11px; color: var(--ink-soft); }
  .kcard { background: #fff; border: 2px solid var(--line); border-radius: 10px 8px 12px 10px / 8px 12px 10px 12px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.25; }
  .kcard .code { font-family: "JetBrains Mono"; font-size: 10px; color: var(--ink-soft); display: block; margin-bottom: 2px; }
  .kcard .who { display: flex; gap: 4px; align-items: center; margin-top: 6px; font-size: 11px; color: var(--ink-soft); }
  .ava { width: 18px; height: 18px; border-radius: 50%; background: var(--grey-soft); border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-family: "JetBrains Mono"; }
  .bar { height: 4px; background: #eee; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: var(--green); }
  .bar.warn > span { background: var(--amber); }
  .bar.late > span { background: var(--red); }

  .col-pendiente header .name, .col-pendiente .name { color: var(--ink-soft); }
  .col-maqueta header .name { color: var(--green); }
  .col-progreso header .name { color: var(--blue); }
  .col-hecho header .name { color: var(--green); }
  .col-desplegado header .name { color: var(--amber); }
  .col-observado header .name { color: var(--red); }
  .col-operativo header .name { color: var(--green); }

  /* forms */
  .form-row { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
  .field { border: 0; border-bottom: 2px solid var(--line); padding: 4px 4px 6px; background: transparent; font-family: "Kalam"; font-size: 15px; width: 100%; }
  .field.ta { border: 2px dashed var(--line-soft); border-radius: 8px; min-height: 64px; padding: 8px; }
  .modal-head { padding: 12px 16px; color: #fff; border-radius: 12px 16px 0 0 / 14px 12px 0 0; font-family: "Caveat"; font-size: 28px; line-height: 1; display:flex; align-items:center; justify-content:space-between; }
  .modal-head.A { background: var(--orange); }
  .modal-head.B { background: var(--blue); }
  .modal-body { padding: 16px 18px 18px; }

  /* flow svg */
  .flow-wrap { padding: 20px; background: #fffdf7; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .swatch { width: 14px; height: 14px; border: 2px solid var(--line); border-radius: 3px; display: inline-block; }
  .sw-A { background: var(--orange-soft); }
  .sw-B { background: var(--blue-soft); }
  .sw-chat { background: #fff; background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.1) 0 4px, transparent 4px 8px); }
  .sw-end { background: var(--green-soft); }

  /* chat */
  .chat { background: #fffdf7; border: 2px solid var(--line); border-radius: 14px 12px 14px 16px/12px 14px 16px 12px; display: flex; flex-direction: column; }
  .chat header { padding: 10px 14px; border-bottom: 2px dashed var(--line-soft); display: flex; justify-content: space-between; align-items: center; }
  .chat .stream { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 360px; }
  .msg { max-width: 78%; padding: 8px 12px; border: 2px solid var(--line); border-radius: 12px 14px 14px 4px/12px 14px 4px 14px; background: #fff; font-size: 14px; line-height: 1.3; }
  .msg.me { align-self: flex-end; background: #fff5e0; border-radius: 14px 12px 4px 14px/14px 12px 14px 4px; }
  .msg .who { font-family: "Caveat"; font-size: 16px; line-height: 1; color: var(--ink-soft); margin-bottom: 4px; display:flex; gap:6px; align-items:center; }
  .msg .att { display: inline-block; margin-top: 6px; padding: 4px 8px; border: 2px dashed var(--line-soft); border-radius: 6px; font-size: 11px; font-family: "JetBrains Mono"; background: #fafafa; }
  .chat footer { padding: 10px; border-top: 2px dashed var(--line-soft); display: flex; gap: 8px; align-items: center; }
  .chat footer .ta { flex: 1; }

  /* timeline */
  .tl { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; }
  .tl .step { padding: 10px 8px 14px; border: 2px solid var(--line); background: #fff; position: relative; text-align: center; font-size: 12px; }
  .tl .step:not(:last-child) { border-right: 0; }
  .tl .step:first-child { border-radius: 12px 0 0 14px/12px 0 0 14px; }
  .tl .step:last-child { border-radius: 0 12px 14px 0/0 14px 14px 0; }
  .tl .step .name { font-family: "Caveat"; font-size: 22px; line-height: 1; display:block; margin-bottom: 4px; }
  .tl .step.done { background: var(--green-soft); }
  .tl .step.now { background: var(--blue-soft); transform: translateY(-3px); box-shadow: 0 4px 0 -1px rgba(0,0,0,.15); z-index: 2; }
  .tl .step.todo { background: #fff; opacity: .65; }
  .tl .step .t { font-family: "JetBrains Mono"; font-size: 10px; color: var(--ink-soft); }
  .tl .step .check { position: absolute; top: -10px; right: -8px; width: 22px; height: 22px; background: var(--green); color:#fff; border:2px solid var(--line); border-radius: 50%; font-size:13px; display:flex; align-items:center; justify-content:center; font-family:"Caveat"; }

  /* macro */
  .macro { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .mstep { padding: 12px; border: 2px solid var(--line); border-radius: 12px 10px 14px 10px/10px 14px 10px 14px; background: #fff; text-align: center; }
  .mstep .n { font-family: "JetBrains Mono"; font-size: 12px; display:block; margin-bottom: 2px; }
  .mstep .name { font-family: "Caveat"; font-size: 26px; line-height: 1; }
  .mstep.s1 { background: #fff1de; }
  .mstep.s2 { background: #e6f3eb; }
  .mstep.s3 { background: #e2ecfb; }
  .mstep.s4 { background: #fbe3f0; }
  .mstep.s5 { background: #ebe0f6; }

  /* table */
  table.cfg { width: 100%; border-collapse: separate; border-spacing: 0; background: #fffdf7; }
  table.cfg th, table.cfg td { border-bottom: 2px dashed var(--line-soft); padding: 10px 12px; text-align: left; font-size: 14px; }
  table.cfg th { font-family: "Caveat"; font-size: 22px; font-weight: 700; background: #f6f0df; border-bottom: 2px solid var(--line); }
  table.cfg td .num { width: 60px; text-align:center; }
  table.cfg tr:last-child td { border-bottom: 0; }

  /* roles */
  .role-card { padding: 14px 16px; background: #fff; }
  .role-card .avb { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-family: "Caveat"; font-size: 22px; background: #fff; }
  .role-card h4 { margin-top: 6px; }

  /* misc */
  .scribble { color: var(--ink-soft); font-family: "Caveat"; font-size: 18px; }
  .arrow-note { color: var(--ink-soft); font-family: "Caveat"; font-size: 18px; }
  .stack { display: grid; gap: 10px; }

  /* role badges in screens */
  .role-pm { background: #fff1de; border-color: var(--orange); color: #7a2d05; }
  .role-an { background: #e2ecfb; border-color: var(--blue); color: #0f3268; }
  .role-so { background: #ece8df; border-color: var(--line); color: var(--ink); }

  /* tweaks docking — placeholder; real panel injected by tweaks-panel.jsx */
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="flow.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
